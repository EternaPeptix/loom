# Example ~/.loom/config.toml for a DeepSeek V4.1 (dsv41) server on the LAN.
# Every field has a default, so you only need the parts you want to change. Unknown keys are an error.

# The profile a session uses when it names none.
default_model = "dsv41"

[daemon]
bind = "127.0.0.1:7878"   # the API and web UI; must be loopback
proxy_port = 0            # egress proxy on 127.0.0.1; 0 = pick a free port

[models.dsv41]
base_url = "http://your-server.local:8000/v1"
model = "dsv41"
# context_window is discovered from the server's /models (max_model_len) when omitted.
max_output_tokens = 32768
reasoning_replay = "all"       # the dsv41 template keeps replayed reasoning in the prefix (cache-safe)
max_concurrent = 6             # concurrent requests across all sessions
stall_timeout_s = 240          # abort and retry a stream that stalls this long
retry_window_s = 0             # keep retrying an unreachable server until it returns
retry_max_delay_s = 30

# Request fields sent verbatim on every call. Fixed for a session's life, because the template
# renders reasoning_effort into the prompt head and changing it would break the cache.
[models.dsv41.extra_body]
reasoning_effort = "max"

[context]
# Absolute token counts per the model window, not shares of it. The working set is sized for
# latency and quality; the rest of the 1M window is burst capacity.
target_tokens = 400000     # plan a re-weave when the server-reported prompt exceeds this
floor_tokens = 180000      # evict down to this
keep_recent_steps = 60

[agents]
max_children = 6
child_max_steps = 60
child_max_minutes = 30
max_nudges = 3
stall_steps = 12
verify_finish = true       # attack a lead's finish with an independent verifier first
unviewed_min_lines = 80

[sandbox]
mode = "seatbelt"          # "seatbelt" (macOS) or "none" (reported loudly)
loopback_all = false

[network]
mode = "deny_all"          # "open", "allowlist" or "deny_all"; web_fetch needs a route
# allow = ["*.rust-lang.org", "docs.rs", "crates.io"]

[notify]
repeat_minutes = 30        # re-notify an unanswered blocking item this often (0 = never)
