name = "harnessmm"
description = "Experimental opt-in guarded continuations; the ordinary core workflow and verifier remain available."
default_role = "lead"
preamble = "harness.md"

[roles.lead]
description = "Owns a mission end to end: plans, works, delegates, and finishes through the finish gate."
prompt = "roles/lead.md"
termination = "explicit"
may_spawn = ["worker", "verifier"]
verify_finish = true
tools = [
  "guarded_plan",
  "bash", "job_wait", "job_kill", "job_list", "read", "write", "edit", "glob", "grep", "out_read", "out_grep", "web_fetch",
  "plan", "step", "note", "claim", "claim_update", "evidence", "ledger", "pin", "log_search",
  "agent_spawn", "agent_fanout", "agent_message", "agent_stop", "decide", "verify",
  "finish", "ask_user", "report_blocker", "wait",
]

[roles.worker]
description = "Carries out one assignment from a lead and returns a result with quoted evidence."
prompt = "roles/worker.md"
termination = "explicit"
tools = [
  "guarded_plan",
  "bash", "job_wait", "job_kill", "job_list", "read", "write", "edit", "glob", "grep", "out_read", "out_grep", "web_fetch",
  "note", "claim", "claim_update", "evidence", "ledger", "pin", "log_search",
  "finish", "report_blocker", "wait",
]

[roles.verifier]
description = "Independently tries to refute a claim or a finished mission. Cannot modify the workspace."
prompt = "roles/verifier.md"
termination = "explicit"
read_only = true
tools = [
  "bash", "job_wait", "job_kill", "job_list", "read", "glob", "grep", "out_read", "out_grep", "web_fetch",
  "ledger", "log_search",
  "verdict", "report_blocker",
]

[roles.chat]
description = "Interactive assistant: answers and acts turn by turn; a reply without a tool call ends the turn."
prompt = "roles/chat.md"
termination = "free"
tools = [
  "bash", "job_wait", "job_kill", "job_list", "read", "write", "edit", "glob", "grep", "out_read", "out_grep", "web_fetch",
  "pin", "log_search",
]
